<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host HQ — 5-Min Live Circuit 🔬</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #070a12;
      --card: rgba(15, 23, 42, 0.88);
      --border: rgba(56, 189, 248, 0.3);
      --cyan: #38bdf8;
      --gold: #f59e0b;
      --green: #22c55e;
      --red: #f43f5e;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body { background: linear-gradient(135deg, #050811 0%, #0f172a 50%, #1a103c 100%); color: #fff; padding: 1.5rem; min-height: 100vh; }

    header { display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 1rem 1.8rem; margin-bottom: 1.5rem; }

    .radar-container { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 1.8rem; margin-bottom: 1.5rem; }
    .track-svg { width: 100%; height: auto; max-height: 320px; }

    .squad-node circle { fill: var(--cyan); stroke: #ffffff; stroke-width: 3; filter: drop-shadow(0 0 10px var(--cyan)); }
    .squad-node text { fill: #fff; font-size: 10px; font-weight: 900; text-anchor: middle; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; }
    .card.winner { border-color: var(--gold); box-shadow: 0 0 25px rgba(245, 158, 11, 0.4); }

    .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--purple)); }

    .btn-reset { background: var(--red); color: white; border: none; padding: 0.7rem 1.4rem; border-radius: 12px; font-weight: 800; cursor: pointer; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <header>
    <div>
      <h1 style="color:var(--cyan); font-size:1.6rem; font-weight:900;">5-MIN SPEED RUN COMMAND HQ</h1>
      <p style="color:#94a3b8; font-size:0.85rem;">Live 5-Question Pedigree Circuit Radar</p>
    </div>
    <button class="btn-reset" onclick="resetHQ()">RESET SPEED RUN 🔄</button>
  </header>

  <div class="radar-container">
    <svg class="track-svg" viewBox="0 0 900 280">
      <path d="M 100 140 L 275 80 L 450 200 L 625 80 L 800 140" fill="none" stroke="rgba(56,189,248,0.2)" stroke-width="6" stroke-dasharray="8" />

      <circle cx="100" cy="140" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
      <text x="100" y="144" fill="#38bdf8" font-size="11" font-weight="900" text-anchor="middle">Q1</text>

      <circle cx="275" cy="80" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
      <text x="275" y="84" fill="#38bdf8" font-size="11" font-weight="900" text-anchor="middle">Q2</text>

      <circle cx="450" cy="200" r="28" fill="#0f172a" stroke="#a855f7" stroke-width="4" />
      <text x="450" y="204" fill="#a855f7" font-size="11" font-weight="900" text-anchor="middle">Q3</text>

      <circle cx="625" cy="80" r="28" fill="#0f172a" stroke="#f43f5e" stroke-width="4" />
      <text x="625" y="84" fill="#f43f5e" font-size="11" font-weight="900" text-anchor="middle">Q4</text>

      <circle cx="800" cy="140" r="32" fill="#0f172a" stroke="#f59e0b" stroke-width="5" />
      <text x="800" y="145" fill="#f59e0b" font-size="16" font-weight="900" text-anchor="middle">🏆</text>

      <g id="teamNodesGroup"></g>
    </svg>
  </div>

  <div class="grid" id="squadGrid"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDtPA9VQ4Yv1MpvbYqdCW24bDf03tOpKqU",
      authDomain: "pedigree-9f98c.firebaseapp.com",
      databaseURL: "https://pedigree-9f98c-default-rtdb.firebaseio.com",
      projectId: "pedigree-9f98c",
      storageBucket: "pedigree-9f98c.firebasestorage.app",
      messagingSenderId: "484562688449",
      appId: "1:484562688449:web:ca050a92acdfcb0b183740"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const coords = {
      1: { x: 100, y: 140 },
      2: { x: 275, y: 80 },
      3: { x: 450, y: 200 },
      4: { x: 625, y: 80 },
      5: { x: 800, y: 140 }
    };

    let firstWinner = false;

    db.ref('teams').on('value', (snap) => {
      const data = snap.val();
      const nodesGroup = document.getElementById('teamNodesGroup');
      const grid = document.getElementById('squadGrid');

      if (!data) {
        nodesGroup.innerHTML = '';
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 2rem;">📡 Waiting for squad connections...</div>`;
        return;
      }

      const list = Object.keys(data).map(k => data[k]);
      list.sort((a, b) => b.stage - a.stage || a.timeElapsed - b.timeElapsed);

      nodesGroup.innerHTML = '';
      grid.innerHTML = '';

      if (list[0] && list[0].status === 'Finished' && !firstWinner) {
        firstWinner = true;
        confetti({ particleCount: 200, spread: 100 });
      }

      list.forEach((squad, idx) => {
        const c = coords[squad.stage] || coords[1];
        const offsetX = (idx % 3 - 1) * 16;
        const offsetY = Math.floor(idx / 3) * 16;

        const node = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        node.setAttribute('class', 'squad-node');
        node.setAttribute('transform', `translate(${c.x + offsetX}, ${c.y + offsetY})`);
        node.innerHTML = `
          <circle r="15" />
          <text y="4">${squad.team.substring(0, 3).toUpperCase()}</text>
        `;
        nodesGroup.appendChild(node);

        const isFinished = squad.status === 'Finished';
        const pct = Math.min(Math.round((squad.stage / 5) * 100), 100);

        const card = document.createElement('div');
        card.className = `card ${isFinished && idx === 0 ? 'winner' : ''}`;
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between;">
            <strong>${idx === 0 ? '🥇 ' : ''}${squad.team}</strong>
            <span style="color:var(--cyan); font-weight:800;">Q${squad.stage} / 5</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%;"></div></div>
          <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#94a3b8;">
            <span>${isFinished ? '🏆 FINISHED' : '⚡ IN FIELD'}</span>
            <span>⏱️ ${squad.timeElapsed || 0}s</span>
          </div>
        `;
        grid.appendChild(card);
      });
    });

    function resetHQ() {
      if (confirm("Reset all positions for a new 5-minute run?")) {
        firstWinner = false;
        db.ref('teams').remove();
      }
    }
  </script>
</body>
</html>
