<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genetics Field Terminal 🔬</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --panel: rgba(15, 23, 42, 0.88);
      --border: rgba(56, 189, 248, 0.25);
      --cyan: #38bdf8;
      --indigo: #6366f1;
      --green: #22c55e;
      --red: #f43f5e;
      --gold: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: linear-gradient(-45deg, #050811, #0f172a, #1e1b4b, #0f172a);
      background-size: 400% 400%; animation: gradientBG 15s ease infinite;
      color: #f8fafc; min-height: 100vh; padding: 1rem;
      display: flex; justify-content: center; align-items: center;
    }
    @keyframes gradientBG { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

    .container { width: 100%; max-width: 1150px; }

    .login-box {
      background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
      padding: 2.5rem; max-width: 440px; margin: 0 auto; text-align: center; backdrop-filter: blur(12px);
    }
    .login-box input {
      width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
      padding: 1rem; border-radius: 12px; color: #fff; font-size: 1rem; font-weight: 700;
      text-align: center; margin: 1.2rem 0; outline: none;
    }

    .waiting-screen {
      display: none; background: var(--panel); border: 2px solid var(--gold); border-radius: 24px;
      padding: 3rem 2rem; text-align: center; max-width: 480px; margin: 0 auto; backdrop-filter: blur(12px);
    }
    .pulse-loader {
      width: 60px; height: 60px; border-radius: 50%; background: var(--gold); margin: 1.5rem auto;
      animation: pulse 1.2s ease-in-out infinite alternate;
    }
    @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 25px var(--gold); } }

    .app-layout { display: none; grid-template-columns: 1fr; gap: 1.5rem; }
    @media (min-width: 880px) { .app-layout { grid-template-columns: 1.15fr 1fr; } }
    .app-layout.active { display: grid; }

    .panel {
      background: var(--panel); border: 2px solid var(--border); border-radius: 20px;
      padding: 1.5rem; backdrop-filter: blur(12px); display: flex; flex-direction: column; gap: 1rem;
      transition: all 0.4s ease;
    }
    .panel.correct-border { border-color: var(--green) !important; box-shadow: 0 0 35px rgba(34, 197, 94, 0.4) !important; }
    .panel.wrong-border { border-color: var(--red) !important; box-shadow: 0 0 35px rgba(244, 63, 94, 0.4) !important; animation: shake 0.4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }

    .pedigree-wrapper { background: #030712; border: 1px solid var(--border); border-radius: 14px; padding: 1rem; }
    svg { width: 100%; height: auto; max-height: 380px; }
    .gen-group { transition: all 0.6s ease; opacity: 0.2; filter: grayscale(90%); }
    .gen-group.active-gen { opacity: 1; filter: drop-shadow(0 0 10px var(--cyan)); }
    .symbol { stroke: #38bdf8; stroke-width: 2.5; fill: #0f172a; }
    .affected { fill: #38bdf8 !important; }
    .line { stroke: #64748b; stroke-width: 2; stroke-dasharray: 4; }

    .q-header { display: flex; justify-content: space-between; font-weight: 800; font-size: 0.85rem; color: var(--cyan); }
    .q-title { font-size: 1.05rem; font-weight: 800; line-height: 1.4; color: #fff; min-height: 3rem; }
    .opts-grid { display: flex; flex-direction: column; gap: 0.65rem; }
    .opt-btn {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px; padding: 0.8rem 1rem; color: #fff; font-weight: 700; font-size: 0.9rem;
      text-align: left; cursor: pointer; transition: all 0.2s;
    }
    .opt-btn:hover:not(:disabled) { background: rgba(56, 189, 248, 0.12); border-color: var(--cyan); }
    .opt-btn.selected { background: linear-gradient(135deg, rgba(56, 189, 248, 0.3), rgba(99, 102, 241, 0.3)); border-color: var(--cyan); }
    .opt-btn:disabled { cursor: not-allowed; opacity: 0.5; }

    .btn {
      background: linear-gradient(135deg, var(--cyan), var(--indigo));
      color: #000; font-weight: 900; padding: 1rem; border: none; border-radius: 12px;
      cursor: pointer; font-size: 1rem; text-transform: uppercase;
      transition: all 0.2s ease;
    }
    .btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

    .timer-badge { font-size: 1.1rem; font-weight: 900; color: var(--gold); background: rgba(245, 158, 11, 0.15); padding: 4px 12px; border-radius: 20px; border: 1px solid var(--gold); }
    .timer-badge.warning { color: var(--red); border-color: var(--red); background: rgba(244, 63, 94, 0.15); animation: shake 0.5s infinite; }

    .finish-screen { display: none; background: var(--panel); border: 2px solid var(--gold); border-radius: 24px; padding: 3rem 2rem; text-align: center; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="container">
    <div class="login-box" id="sLogin">
      <h2 style="color:var(--cyan); font-size: 1.8rem; font-weight: 900;">🧬 5-MIN SPEED RUN</h2>
      <p style="color:#94a3b8; font-size: 0.9rem; margin-top: 0.4rem;">5 Rounds • 11 Questions • 300 Seconds</p>
      <input type="text" id="teamInput" placeholder="Enter Squad Name..." maxlength="15" aria-label="Enter Squad Name">
      <button class="btn" style="width:100%;" onclick="joinLobby()" aria-label="Join Game Lobby">JOIN LOBBY 🚀</button>
    </div>

    <div class="waiting-screen" id="sWaiting">
      <h2 style="color:var(--gold); font-size:1.8rem; font-weight:900;">CONNECTED TO HQ 📡</h2>
      <p style="color:#94a3b8; margin-top:0.5rem;" id="txtWaitSquad">Squad Registered!</p>
      <div class="pulse-loader"></div>
      <h3 style="color:#fff; font-size:1.2rem; font-weight:800;" id="txtWaitStatus">Waiting for Host to start the race...</h3>
    </div>

    <div class="app-layout" id="sGame">
      <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 style="font-size: 1.1rem; color: var(--cyan); font-weight: 800;">🔬 4-GEN PEDIGREE</h3>
          <span class="timer-badge" id="txtTimer" aria-label="Remaining time timer">⏱️ 05:00</span>
        </div>

        <div class="pedigree-wrapper">
          <svg viewBox="0 0 320 280" role="img" aria-label="Interactive 4-generation pedigree chart">
            <g class="gen-group" id="gen1" aria-label="Generation 1: Unaffected Father and Unaffected Mother">
              <text x="5" y="30" fill="#64748b" font-size="10" font-weight="800">GEN I</text>
              <line x1="80" y1="25" x2="140" y2="25" class="line" />
              <rect x="55" y="10" width="25" height="25" class="symbol" role="img" aria-label="Generation 1 Male, Unaffected" />
              <circle cx="155" cy="22" r="13" class="symbol" role="img" aria-label="Generation 1 Female, Unaffected" />
            </g>

            <line x1="110" y1="25" x2="110" y2="65" class="line" />
            <line x1="60" y1="65" x2="220" y2="65" class="line" />

            <g class="gen-group" id="gen2" aria-label="Generation 2: Affected Son, Unaffected Daughter and Partner">
              <text x="5" y="100" fill="#64748b" font-size="10" font-weight="800">GEN II</text>
              <line x1="60" y1="65" x2="60" y2="90" class="line" />
              <line x1="220" y1="65" x2="220" y2="90" class="line" />
              <rect x="48" y="90" width="25" height="25" class="symbol affected" role="img" aria-label="Generation 2 Male, Affected" />
              <circle cx="220" cy="102" r="13" class="symbol" role="img" aria-label="Generation 2 Female, Unaffected" />
              <line x1="233" y1="102" x2="270" y2="102" class="line" />
              <rect x="270" y="90" width="25" height="25" class="symbol" role="img" aria-label="Generation 2 Male Partner, Unaffected" />
            </g>

            <line x1="250" y1="102" x2="250" y2="145" class="line" />
            <line x1="180" y1="145" x2="280" y2="145" class="line" />

            <g class="gen-group" id="gen3" aria-label="Generation 3: Affected Daughter, Partner, Unaffected Son">
              <text x="5" y="175" fill="#64748b" font-size="10" font-weight="800">GEN III</text>
              <line x1="180" y1="145" x2="180" y2="165" class="line" />
              <line x1="280" y1="145" x2="280" y2="165" class="line" />
              <circle cx="180" cy="178" r="13" class="symbol affected" role="img" aria-label="Generation 3 Female, Affected" />
              <rect x="268" y="165" width="25" height="25" class="symbol" role="img" aria-label="Generation 3 Male, Unaffected" />
              <line x1="193" y1="178" x2="225" y2="178" class="line" />
              <rect x="225" y="165" width="25" height="25" class="symbol" role="img" aria-label="Generation 3 Male Partner, Unaffected" />
            </g>

            <line x1="209" y1="178" x2="209" y2="220" class="line" />

            <g class="gen-group" id="gen4" aria-label="Generation 4: Affected Daughter">
              <text x="5" y="248" fill="#64748b" font-size="10" font-weight="800">GEN IV</text>
              <line x1="209" y1="220" x2="209" y2="238" class="line" />
              <circle cx="209" cy="250" r="13" class="symbol affected" role="img" aria-label="Generation 4 Female, Affected" />
            </g>
          </svg>
        </div>
      </div>

      <div class="panel" id="questionPanel">
        <div class="q-header">
          <span id="txtSquad">SQUAD: ---</span>
          <span id="txtRoundBadge">ROUND 1 • Q1/11</span>
        </div>

        <div class="q-title" id="txtQuestion">Loading...</div>
        <div class="opts-grid" id="boxOptions"></div>
        <div style="min-height:1.5rem; font-weight:800; text-align:center;" id="txtFeedback"></div>

        <button class="btn" id="btnSubmit" onclick="submitAnswer()" aria-label="Submit Answer">SUBMIT ANSWER ⚡</button>
      </div>
    </div>

    <div class="finish-screen" id="sFinish">
      <div style="font-size:4rem;">🏆✨</div>
      <h2 style="color:var(--gold); font-size:2rem; font-weight:900;" id="txtFinishTitle">MISSION COMPLETE!</h2>
      <p style="color:#94a3b8; margin: 0.5rem 0 1.5rem 0;" id="txtFinishSub">You successfully decoded all 5 rounds!</p>
      <h3 style="color:var(--green); font-size:1.5rem;" id="txtFinalTime">Remaining Time: --:--</h3>
      <button class="btn" style="margin-top: 1.5rem; padding: 1rem 2rem;" onclick="resetGame()" aria-label="Play Again">PLAY AGAIN 🔄</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDtPA9VQ4Yv1MpvbYqdCW24bDf03tOpKqU",
      authDomain: "pedigree-9f98c.firebaseapp.com",
      databaseURL: "https://pedigree-9f98c-default-rtdb.firebaseio.com",
      projectId: "pedigree-9f98c",
      storageBucket: "pedigree-9f98c.firebasestorage.app",
      messagingSenderId: "484562688449",
      appId: "1:484562688449:web:ca050a92acdfcb0b183740"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const questions = [
      { gen: 1, round: 1, qNum: "1/11", q: "R1-Q1 [Gen I]: What do the Square and Circle shapes represent in a pedigree chart?", opts: ["Square = Male | Circle = Female", "Circle = Male | Square = Female", "Square = Affected | Circle = Carrier", "Square = Deceased | Circle = Alive"], ans: "Square = Male | Circle = Female" },
      { gen: 1, round: 1, qNum: "2/11", q: "R1-Q2 [Gen I]: What does a shaded symbol mean in a standard pedigree?", opts: ["Deceased individual", "Affected by the genetic trait/condition", "Unaffected carrier only", "Adopted individual"], ans: "Affected by the genetic trait/condition" },
      { gen: 2, round: 2, qNum: "3/11", q: "R2-Q1 [Gen II]: Gen II Son 1 is shaded blue (ff). What MUST be the genotypes of unshaded parents in Gen I?", opts: ["Both are Heterozygous (Ff)", "Both are Homozygous Dominant (FF)", "One is (FF), One is (ff)", "Both are Homozygous Recessive (ff)"], ans: "Both are Heterozygous (Ff)" },
      { gen: 2, round: 2, qNum: "4/11", q: "R2-Q2 [Gen II]: Gen II Daughter is unshaded. Knowing her parents are Ff x Ff, what is her possible genotype?", opts: ["Must be ff", "Either FF or Ff", "Must be FF only", "Must be Ff only"], ans: "Either FF or Ff" },
      { gen: 2, round: 2, qNum: "5/11", q: "R2-Q3 [Gen II]: Horizontal line connecting Gen II Daughter and her partner represents what?", opts: ["Identical twins", "Mating / Marriage", "Divorced lineage", "Sibling connection"], ans: "Mating / Marriage" },
      { gen: 3, round: 3, qNum: "6/11", q: "R3-Q1 [Gen III]: Gen III Daughter (ff) marries an unshaded Male (Ff). What is the chance of an affected child?", opts: ["50% Chance", "25% Chance", "75% Chance", "0% Chance"], ans: "50% Chance" },
      { gen: 3, round: 3, qNum: "7/11", q: "R3-Q2 [Gen III]: What fraction of offspring from ff x Ff will be carrier (Ff) heterozygous?", opts: ["1/4 (25%)", "1/2 (50%)", "3/4 (75%)", "4/4 (100%)"], ans: "1/2 (50%)" },
      { gen: 4, round: 4, qNum: "8/11", q: "R4-Q1 [Gen IV]: Gen IV child is shaded (ff). What is the chance her parents (Ff x Ff) have a NORMAL child?", opts: ["75% Chance", "25% Chance", "100% Chance", "50% Chance"], ans: "75% Chance" },
      { gen: 4, round: 4, qNum: "9/11", q: "R4-Q2 [Gen IV]: What is the probability that a normal (unshaded) child of Ff x Ff is a CARRIER (Ff)?", opts: ["1/2 (50%)", "2/3 (~67%)", "1/4 (25%)", "3/4 (75%)"], ans: "2/3 (~67%)" },
      { gen: 4, round: 4, qNum: "10/11", q: "R4-Q3 [Gen IV]: In this 4-generation pedigree, why did the trait 'skip' Gen I phenotype-wise?", opts: ["Trait is recessive, carried hiddenly by Gen I (Ff)", "Trait mutated spontaneously in Gen II", "Trait is environment-driven only", "Trait is X-linked dominant"], ans: "Trait is recessive, carried hiddenly by Gen I (Ff)" },
      { gen: 4, round: 5, qNum: "11/11", q: "R5-FINAL [PUNNETT CHALLENGE]: If Gen IV Daughter (ff) marries a carrier male (Ff), and they have 3 children, what is the exact probability that ALL 3 children are affected (ff)?", opts: ["1/8 (12.5%)", "1/4 (25%)", "1/16 (6.25%)", "1/2 (50%)"], ans: "1/8 (12.5%)" }
    ];

    let teamName = "";
    let idx = 0;
    let selectedText = null;
    let currentShuffledOpts = [];
    let timeLeft = 300;
    let timerInterval = null;
    let isLocked = false;
    let serverOffset = 0;
    let startTime = null;

    db.ref('.info/serverTimeOffset').on('value', (snap) => {
      serverOffset = snap.val() || 0;
    });

    function shuffleArray(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function joinLobby() {
      teamName = document.getElementById('teamInput').value.trim();
      if (!teamName) return alert("Enter Squad Name!");

      db.ref('teams/' + teamName).set({ team: teamName, stage: 1, round: 1, status: "In Lobby", timeElapsed: 0 });

      document.getElementById('txtSquad').textContent = `SQUAD: ${teamName.toUpperCase()}`;
      document.getElementById('txtWaitSquad').textContent = `Squad: ${teamName.toUpperCase()}`;
      document.getElementById('sLogin').style.display = 'none';
      document.getElementById('sWaiting').style.display = 'block';

      listenForStart();
    }

    function listenForStart() {
      db.ref('quizState/startTime').on('value', (snap) => {
        startTime = snap.val();

        if (startTime) {
          if (timerInterval) clearInterval(timerInterval);

          timerInterval = setInterval(() => {
            const exactServerNow = Date.now() + serverOffset;
            const elapsedSeconds = Math.floor((exactServerNow - startTime) / 1000);

            if (elapsedSeconds < 0) {
              document.getElementById('txtWaitStatus').textContent = `🚀 RACE STARTING IN ${Math.abs(elapsedSeconds)}s...`;
              return;
            }

            if (document.getElementById('sWaiting').style.display !== 'none') {
              document.getElementById('sWaiting').style.display = 'none';
              document.getElementById('sGame').classList.add('active');
              loadQuestion();
            }

            timeLeft = Math.max(0, 300 - elapsedSeconds);
            let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let s = (timeLeft % 60).toString().padStart(2, '0');
            const badge = document.getElementById('txtTimer');
            badge.textContent = `⏱️ ${m}:${s}`;

            if (timeLeft <= 60) badge.classList.add('warning');

            if (timeLeft <= 0) {
              clearInterval(timerInterval);
              finishGame(false);
            }
          }, 1000);
        } else {
          document.getElementById('sWaiting').style.display = 'block';
          document.getElementById('sGame').classList.remove('active');
          document.getElementById('txtWaitStatus').textContent = "Waiting for Host to start the race...";
        }
      });
    }

    function renderOptions(optionsList) {
      selectedText = null;
      const box = document.getElementById('boxOptions');
      box.innerHTML = "";

      optionsList.forEach((txt, i) => {
        const prefix = String.fromCharCode(65 + i);
        const btn = document.createElement('button');
        btn.className = "opt-btn";
        btn.textContent = `${prefix}. ${txt}`;
        btn.setAttribute('aria-label', `Option ${prefix}: ${txt}`);
        btn.onclick = () => {
          if (isLocked) return;
          selectedText = txt;
          document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        };
        box.appendChild(btn);
      });
    }

    function loadQuestion() {
      document.getElementById('txtFeedback').textContent = "";
      const q = questions[idx];

      document.getElementById('txtRoundBadge').textContent = `ROUND ${q.round} • Q${q.qNum}`;
      document.getElementById('txtQuestion').textContent = q.q;

      document.querySelectorAll('.gen-group').forEach(g => g.classList.remove('active-gen'));
      document.getElementById(`gen${q.gen}`).classList.add('active-gen');

      currentShuffledOpts = shuffleArray(q.opts);
      renderOptions(currentShuffledOpts);
    }

    function submitAnswer() {
      if (isLocked) return;

      const panel = document.getElementById('questionPanel');
      const fb = document.getElementById('txtFeedback');
      const submitBtn = document.getElementById('btnSubmit');

      if (!selectedText) {
        fb.style.color = "var(--red)";
        fb.textContent = "⚠️ Pick an option!";
        return;
      }

      if (selectedText === questions[idx].ans) {
        panel.classList.remove('wrong-border');
        panel.classList.add('correct-border');
        fb.style.color = "var(--green)";
        fb.textContent = "✨ CORRECT!";
        confetti({ particleCount: 25, spread: 50, origin: { y: 0.7 } });

        idx++;
        let elapsed = 300 - timeLeft;

        if (idx >= questions.length) {
          clearInterval(timerInterval);
          db.ref('teams/' + teamName).update({ stage: 5, round: 5, status: "Finished", timeElapsed: elapsed });
          setTimeout(() => finishGame(true), 600);
        } else {
          db.ref('teams/' + teamName).update({ stage: questions[idx].gen, round: questions[idx].round, status: "Active", timeElapsed: elapsed });
          setTimeout(() => { panel.classList.remove('correct-border'); loadQuestion(); }, 600);
        }
      } else {
        isLocked = true;
        submitBtn.disabled = true;
        document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
        panel.classList.remove('correct-border');
        panel.classList.add('wrong-border');

        let penaltyTime = 7;
        fb.style.color = "var(--red)";
        fb.textContent = `🔒 INCORRECT! TRY AGAIN IN ${penaltyTime}s`;

        let penaltyInterval = setInterval(() => {
          penaltyTime--;
          if (penaltyTime > 0) {
            fb.textContent = `🔒 INCORRECT! TRY AGAIN IN ${penaltyTime}s`;
          } else {
            clearInterval(penaltyInterval);
            isLocked = false;
            submitBtn.disabled = false;
            
            currentShuffledOpts = shuffleArray(questions[idx].opts);
            renderOptions(currentShuffledOpts);

            panel.classList.remove('wrong-border');
            fb.style.color = "var(--gold)";
            fb.textContent = "🔀 Options reshuffled! Try again!";
          }
        }, 1000);
      }
    }

    function finishGame(win) {
      document.getElementById('sGame').classList.remove('active');
      const screen = document.getElementById('sFinish');
      screen.style.display = 'block';

      if (win) {
        let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
        document.getElementById('txtFinishTitle').textContent = "SPEED RUN VICTORY! 🏆";
        document.getElementById('txtFinalTime').textContent = `Time Remaining: ${m}m ${s}s`;
        confetti({ particleCount: 150, spread: 90 });
      } else {
        document.getElementById('txtFinishTitle').textContent = "⏰ TIME EXPIRED!";
        document.getElementById('txtFinishSub').textContent = "5 minutes passed! Try again on the next speed run.";
        document.getElementById('txtFinalTime').textContent = `Reached Question ${idx + 1} of 11`;
      }
    }

    function resetGame() {
      if (timerInterval) clearInterval(timerInterval);
      idx = 0;
      timeLeft = 300;
      selectedText = null;
      isLocked = false;

      const submitBtn = document.getElementById('btnSubmit');
      if (submitBtn) submitBtn.disabled = false;

      const badge = document.getElementById('txtTimer');
      badge.textContent = "⏱️ 05:00";
      badge.classList.remove('warning');

      const panel = document.getElementById('questionPanel');
      panel.classList.remove('correct-border', 'wrong-border');

      document.getElementById('sFinish').style.display = 'none';
      document.getElementById('sWaiting').style.display = 'none';
      document.getElementById('sLogin').style.display = 'block';
    }
  </script>
</body>
</html>
