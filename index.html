<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genetics Field Terminal 🔬</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.95);
      --border: rgba(56, 189, 248, 0.3);
      --cyan: #38bdf8;
      --green: #22c55e;
      --red: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1rem; }
    .container { width: 100%; max-width: 480px; }
    
    .screen { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; display: none; flex-direction: column; gap: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .screen.active { display: flex; }

    h2 { color: var(--cyan); font-size: 1.4rem; font-weight: 800; text-align: center; }
    p { font-size: 0.9rem; color: #9ca3af; line-height: 1.4; }

    input { width: 100%; background: #000; border: 1px solid var(--border); padding: 0.8rem; border-radius: 10px; color: #fff; font-size: 1rem; text-align: center; font-weight: 700; }
    
    .btn { background: var(--cyan); color: #000; font-weight: 800; padding: 0.9rem; border: none; border-radius: 12px; cursor: pointer; font-size: 0.95rem; text-transform: uppercase; }
    .btn:active { transform: scale(0.98); }

    .diagram { background: #000; border: 1px solid var(--border); padding: 0.8rem; border-radius: 10px; font-family: monospace; font-size: 0.85rem; text-align: center; color: var(--cyan); white-space: pre; }

    .opt-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); padding: 0.8rem; border-radius: 10px; color: #fff; font-size: 0.9rem; font-weight: 700; text-align: left; cursor: pointer; }
    .opt-btn.selected { background: rgba(56, 189, 248, 0.25); border-color: var(--cyan); }

    .feedback { font-size: 0.85rem; font-weight: 800; text-align: center; min-height: 1.2rem; }
    .feedback.err { color: var(--red); }
    .feedback.ok { color: var(--green); }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="container">
    <!-- LOGIN -->
    <div class="screen active" id="sLogin">
      <h2>🧬 SQUAD LOGIN</h2>
      <p style="text-align:center;">Enter your group name to start the Genetics Challenge!</p>
      <input type="text" id="teamInput" placeholder="Team Name (e.g. Bio Squad)" maxlength="15">
      <button class="btn" onclick="startApp()">START MISSION 🚀</button>
    </div>

    <!-- QUIZ -->
    <div class="screen" id="sQuiz">
      <div style="display:flex; justify-content:space-between; font-size:0.75rem; font-weight:800; color:var(--cyan);">
        <span id="txtSquad">SQUAD</span>
        <span id="txtStage">Q1 / 5</span>
      </div>

      <div class="diagram" id="dDiagram">---</div>
      <div style="font-weight:700; font-size:0.95rem;" id="qText">Loading question...</div>
      <div id="optsBox" style="display:flex; flex-direction:column; gap:0.5rem;"></div>
      <div class="feedback" id="fbText"></div>

      <button class="btn" onclick="checkAnswer()">SUBMIT ANSWER ⚡</button>
    </div>

    <!-- FINISH -->
    <div class="screen" id="sFinish" style="text-align:center;">
      <h2>🏆 MISSION COMPLETED!</h2>
      <p>Great job! You have successfully solved all 5 genetics cases.</p>
      <div style="font-size:3rem; margin:1rem 0;">🧬✨</div>
      <p style="color:var(--green); font-weight:800;" id="txtTime">Time: 0m 0s</p>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDtPA9VQ4Yv1MpvbYqdCW24bDf03tOpKqU",
      authDomain: "pedigree-9f98c.firebaseapp.com",
      databaseURL: "https://pedigree-9f98c-default-rtdb.firebaseio.com",
      projectId: "pedigree-9f98c",
      storageBucket: "pedigree-9f98c.firebasestorage.app",
      messagingSenderId: "484562688449",
      appId: "1:484562688449:web:ca050a92acdfcb0b183740"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const quiz = [
      {
        q: "1. SYMBOLS: In a pedigree chart, what shape represents a MALE and what represents a FEMALE?",
        diagram: "⬜ = Male       ◯ = Female\n⬛ = Affected   ● = Affected",
        opts: ["A. Square = Male, Circle = Female", "B. Circle = Male, Square = Female", "C. Both shapes mean Male"],
        ans: "A"
      },
      {
        q: "2. RELATIONSHIPS: What does a horizontal line directly connecting a square and circle mean?",
        diagram: "  (⬜ Dad) --------- (◯ Mom)\n               |\n           (⬜ Son)",
        opts: ["A. They are brother and sister", "B. They are parents / married", "C. They are twins"],
        ans: "B"
      },
      {
        q: "3. TRAITS: In this pedigree, SHADED shapes (⬛/●) have Freckles. How many total offspring have freckles?",
        diagram: "   (⬜) --- (◯)\n         |\n  +------+------+---\n  |      |      |\n (⬛)   (◯)    (●)",
        opts: ["A. 1 offspring", "B. 2 offspring", "C. 3 offspring"],
        ans: "B"
      },
      {
        q: "4. GENOTYPES: Having Freckles (F) is dominant over No Freckles (f). If a child has NO freckles, what is their genotype?",
        diagram: "Dominant:   F (Freckles)\nRecessive:  f (No Freckles)\nChild: Unshaded shape (no freckles)",
        opts: ["A. FF", "B. Ff", "C. ff"],
        ans: "C"
      },
      {
        q: "5. CHANCES: Two heterozygous parents (Ff x Ff) have a child. What is the chance the child gets NO freckles (ff)?",
        diagram: "Punnett Square (Ff x Ff):\nFF (25%)  |  Ff (50%)  |  ff (25%)",
        opts: ["A. 25% chance", "B. 50% chance", "C. 100% chance"],
        ans: "A"
      }
    ];

    let team = "";
    let qIdx = 0;
    let selected = null;
    let startTime = 0;

    function startApp() {
      team = document.getElementById('teamInput').value.trim();
      if (!team) return alert("Please enter a Squad Name!");

      startTime = Date.now();
      db.ref('teams/' + team).set({ team: team, stage: 1, status: "Active", timeElapsed: 0 });

      document.getElementById('txtSquad').textContent = `SQUAD: ${team}`;
      document.getElementById('sLogin').classList.remove('active');
      document.getElementById('sQuiz').classList.add('active');
      loadQ();
    }

    function loadQ() {
      selected = null;
      document.getElementById('fbText').textContent = "";
      const item = quiz[qIdx];
      document.getElementById('txtStage').textContent = `Q${qIdx + 1} / 5`;
      document.getElementById('dDiagram').textContent = item.diagram;
      document.getElementById('qText').textContent = item.q;

      const box = document.getElementById('optsBox');
      box.innerHTML = "";
      item.opts.forEach((txt, i) => {
        const key = String.fromCharCode(65 + i);
        const btn = document.createElement('div');
        btn.className = "opt-btn";
        btn.textContent = txt;
        btn.onclick = () => {
          selected = key;
          document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        };
        box.appendChild(btn);
      });
    }

    function checkAnswer() {
      const fb = document.getElementById('fbText');
      if (!selected) {
        fb.className = "feedback err";
        fb.textContent = "⚠️ Click an answer option above first!";
        return;
      }

      if (selected === quiz[qIdx].ans) {
        fb.className = "feedback ok";
        fb.textContent = "✅ Correct!";
        qIdx++;
        let elapsed = Math.floor((Date.now() - startTime) / 1000);

        if (qIdx >= quiz.length) {
          db.ref('teams/' + team).update({ stage: 5, status: "Finished", timeElapsed: elapsed });
          setTimeout(() => {
            document.getElementById('sQuiz').classList.remove('active');
            document.getElementById('sFinish').classList.add('active');
            let m = Math.floor(elapsed / 60), s = elapsed % 60;
            document.getElementById('txtTime').textContent = `Time: ${m}m ${s}s`;
          }, 500);
        } else {
          db.ref('teams/' + team).update({ stage: qIdx + 1, status: "Active", timeElapsed: elapsed });
          setTimeout(loadQ, 500);
        }
      } else {
        fb.className = "feedback err";
        fb.textContent = "❌ Not quite! Try another choice.";
      }
    }
  </script>
</body>
</html>
